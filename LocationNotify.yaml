blueprint:
  name: Coordinate-Based To-Do List Reminder
  description: >
    Triggers a To-Do list notification using raw GPS coordinates or an interactive 
    map pin.
  domain: automation
  input:
    person_entity:
      name: Person
      description: The person entity to track (must have latitude/longitude attributes).
      selector:
        entity:
          domain: person
    location_name:
      name: Location Name
      description: Friendly name for the notification title (e.g., "Hardware Store").
      default: "Target Location"
      selector:
        text:
    target_coordinates:
      name: Target Map Location & Radius
      description: Drop a pin on the map or enter coordinates. Drag the circle edge to set the radius.
      selector:
        location:
          radius: true
    zone_event:
      name: Trigger Event
      description: Trigger when entering or leaving the coordinate radius.
      default: enter
      selector:
        select:
          options:
            - label: Entering Area
              value: enter
            - label: Leaving Area
              value: leave
    todo_list:
      name: To-Do List
      description: The To-Do list entity containing tasks for this location.
      selector:
        entity:
          domain: todo
    notify_service:
      name: Notification Service
      description: The notification service to call (e.g., notify.mobile_app_pixel_11).
      default: notify.notify
      selector:
        text:

variables:
  person: !input person_entity
  loc: !input target_coordinates
  event_type: !input zone_event
  loc_name: !input location_name
  todo_entity: !input todo_list
  # distance() returns km by default; convert to meters and compare against selector radius (default 100m)
  radius_m: "{{ loc.radius | default(100) | float }}"

trigger:
  - platform: template
    value_template: >-
      {% set dist_m = distance(person, loc.latitude, loc.longitude) * 1000 %}
      {% if event_type == 'enter' %}
        {{ dist_m <= radius_m }}
      {% else %}
        {{ dist_m > radius_m }}
      {% endif %}

condition:
  - condition: template
    value_template: "{{ states(todo_entity) | int(0) > 0 }}"

action:
  - action: todo.get_items
    target:
      entity_id: !input todo_list
    data:
      status: needs_action
    response_variable: active_tasks
  - action: !input notify_service
    data:
      title: "📍 {{ loc_name }} Reminders ({{ active_tasks[todo_entity]['items'] | count }})"
      message: >-
        {% for item in active_tasks[todo_entity]['items'] -%}
        • {{ item.summary }}{% if not loop.last %}{{ '\n' }}{% endif %}
        {%- endfor %}
      data:
        tag: "coord_reminder_{{ loc_name | slugify }}"
        clickAction: "/todo?entity_id={{ todo_entity }}"
        url: "/todo?entity_id={{ todo_entity }}"

mode: single
