blueprint:
  name: Live Update - Open Doors & Windows Notification
  description: >
    Pins an Android 16+ Live Update notification (status bar chip, Always-On
    Display, and top of notification shade) whenever any selected door, window,
    or cover entity is open, updating in-place and clearing when all are closed.
  domain: automation
  input:
    monitored_entities:
      name: Doors, Windows & Covers
      description: Select all door/window binary sensors or garage covers to monitor.
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
              device_class:
                - door
                - garage_door
                - window
                - opening
            - domain: cover
              device_class:
                - garage
                - door
                - gate
                - window
    notify_device:
      name: Mobile App Device
      description: Select the Android phone (e.g., Pixel) to receive the Live Update.
      selector:
        device:
          integration: mobile_app
    show_timer_in_chip:
      name: Show Elapsed Timer in Status Bar Chip
      description: >
        If enabled, the status bar chip displays a live-counting timer since the
        oldest currently open door/window was opened. If disabled, it shows the
        short text label (e.g., "1 Open").
      default: false
      selector:
        boolean:
    notification_channel:
      name: Notification Channel
      description: Android notification channel name.
      default: "Security Alerts"
      selector:
        text:
    notification_tag:
      name: Notification Tag
      description: Unique identifier used to update and dismiss the Live Update.
      default: "open_entry_live_alert"
      selector:
        text:
    notification_icon:
      name: Notification Icon
      description: Material Design Icon displayed in the status bar chip and card.
      default: "mdi:shield-alert"
      selector:
        icon:
    notification_color:
      name: Notification Color (Hex)
      description: Accent color for the Live Update card and chip.
      default: "#FF5252"
      selector:
        text:

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input monitored_entities
    from:
      - "off"
      - "on"
      - "closed"
      - "open"
    to:
      - "on"
      - "off"
      - "open"
      - "closed"

variables:
  entities_list: !input monitored_entities
  open_objs: >
    {{ expand(entities_list)
       | selectattr('state', 'in', ['on', 'open'])
       | list }}
  open_sensors: >
    {{ open_objs | map(attribute='name') | list }}
  open_count: "{{ open_sensors | count }}"
  # Timestamp (in ms) of the earliest opened sensor currently still open
  oldest_open_ms: >
    {% if open_objs | count > 0 %}
      {{ (open_objs | map(attribute='last_changed') | min).timestamp() | multiply(1000) | int }}
    {% else %}
      0
    {% endif %}
  use_timer: !input show_timer_in_chip
  tag_id: !input notification_tag
  channel_name: !input notification_channel
  icon_name: !input notification_icon
  accent_color: !input notification_color

actions:
  - choose:
      # Branch 1: One or more monitored entities are open -> Start or Update Live Activity
      - conditions:
          - condition: template
            value_template: "{{ open_count > 0 }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: >
              🚪 {{ open_count }} {{ 'Entry' if open_count == 1 else 'Entries' }} Open
            message: >
              Currently open: {{ open_sensors | join(', ') }}
            data:
              tag: "{{ tag_id }}"
              live_update: true
              critical_text: "{{ open_count }} Open"
              chronometer: "{{ use_timer }}"
              when: "{{ oldest_open_ms if use_timer else 0 }}"
              when_relative: false
              alert_once: true
              sticky: true
              persistent: true
              channel: "{{ channel_name }}"
              importance: high
              ttl: 0
              priority: high
              notification_icon: "{{ icon_name }}"
              color: "{{ accent_color }}"

      # Branch 2: All monitored entities are closed -> End Live Activity
      - conditions:
          - condition: template
            value_template: "{{ open_count == 0 }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: "clear_notification"
            data:
              tag: "{{ tag_id }}"
